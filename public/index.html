<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amtscup KI-Test</title><style>
:root{--b:#08101d;--p:#121b2d;--p2:#17233a;--t:#eef4ff;--m:#a9b5c9;--a:#50b7ff;--l:#2a3853}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Arial,sans-serif}main{max-width:720px;margin:auto;padding:18px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:16px;margin-bottom:14px}h1{font-size:24px}h2{font-size:19px}input,button{width:100%;padding:13px;border-radius:12px;border:1px solid var(--l);background:var(--p2);color:var(--t);font-size:16px}button{background:var(--a);color:#06111f;font-weight:700;margin-top:12px}.muted{color:var(--m)}.photo img{max-width:100%;max-height:420px;border-radius:12px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.s{border-top:1px solid var(--l);padding-top:10px;margin-top:10px}.warn{color:#ffd46b}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main>
<h1>Amtscup Konolfingen – echter KI-Test</h1><p class="muted">Standblatt fotografieren – KI liest die Angaben, du kontrollierst sie.</p>
<div class="card"><h2>1. Standblatt</h2><p id="server" class="muted">Verbindung wird geprüft …</p><div class="photo" id="pv"></div><input id="photo" type="file" accept="image/*" capture="environment"><button id="go">🤖 Mit KI auswerten</button><p id="status" class="muted">Noch kein Foto ausgewertet.</p></div>
<div class="card hidden" id="result"><h2>2. Erkannte Daten kontrollieren</h2><div class="grid"><div>Disziplin<input id="disz"></div><div>Runde<input id="runde"></div><div>Kombination<input id="komb"></div><div>Sektion<input id="sek"></div><div>Gruppe<input id="grp"></div></div><div id="shooters"></div><div style="margin-top:12px">Gruppenresultat<input id="gt"></div><p id="notes" class="warn"></p><button onclick="alert('Nächster Schritt: Speichern in Datenbank und Rangliste aktualisieren.')">✓ Kontrolliert</button></div>
<script>
photo.onchange=()=>{const f=photo.files[0];if(f)pv.innerHTML='<img src="'+URL.createObjectURL(f)+'">'};
go.onclick=async()=>{const f=photo.files[0];if(!f){status.textContent='Bitte zuerst ein Foto wählen.';return}status.textContent='KI liest das Standblatt …';go.disabled=true;try{const fd=new FormData();fd.append('photo',f);const r=await fetch('/api/analyse',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'Fehler');disz.value=d.disziplin||'';runde.value=d.runde||'';komb.value=d.kombination||'';sek.value=d.sektion||'';grp.value=d.gruppe||'';gt.value=d.gruppen_resultat??'';shooters.innerHTML='';(d.schuetzen||[]).forEach((x,i)=>{shooters.innerHTML+=`<div class="s"><b>${i+1}. Schütze ${x.unsicher?'⚠️':''}</b><div class="grid"><div>Name<input value="${(x.name||'').replaceAll('"','&quot;')}"></div><div>Jahrgang<input value="${x.jahrgang||''}"></div><div>Total<input type="number" value="${x.total??''}"></div></div></div>`});notes.textContent=(d.hinweise||[]).join(' • ');result.classList.remove('hidden');status.textContent='Auswertung fertig – bitte alles mit dem Original vergleichen.';result.scrollIntoView({behavior:'smooth'})}catch(e){status.textContent=e.message}finally{go.disabled=false}};
fetch('/api/health').then(r=>r.json()).then(d=>{server.textContent=d.aiConfigured?'✓ Online – KI ist bereit':'⚠ Online – KI muss noch eingerichtet werden';}).catch(()=>{server.textContent='⚠ Server momentan nicht erreichbar';});
</script></main></body></html>
